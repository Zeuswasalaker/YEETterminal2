name: Check company event sources
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13,22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: event-source-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python refresh_ir.py
      - name: Save source checks
        run: |
          git config user.name "YEET event monitor"
          git config user.email "event-monitor@users.noreply.github.com"
          git add data/source_checks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update company event source checks"
            git push
          fi
